<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alfrjany Hen Host</title>
    <style>
        :root {
            --bg-color: #06080c;
            --card-bg: rgba(18, 22, 31, 0.85);
            --accent-color: #00f0ff;
            --accent-glow: rgba(0, 240, 255, 0.4);
            --text-main: #f0f6fc;
            --text-sub: #8b949e;
            --border-color: #262c36;
            --success-color: #00ff88;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { 
            background: var(--bg-color); 
            background-image: radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.08), transparent 75%);
            color: var(--text-main); 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
        }

        /* Top Bar & Alfrjany Hen Menu */
        .top-bar {
            width: 100%; max-width: 900px; display: flex; justify-content: space-between;
            align-items: center; padding: 12px 20px; background: var(--card-bg);
            border: 1px solid var(--border-color); border-radius: 12px; margin-bottom: 25px;
            backdrop-filter: blur(10px);
        }

        .brand-hen {
            color: var(--accent-color); font-weight: bold; font-size: 1.3rem;
            text-shadow: 0 0 12px var(--accent-glow); display: flex; align-items: center; gap: 8px;
        }

        .status-badge { font-size: 0.85rem; color: var(--text-sub); }

        .fw-selector { display: flex; gap: 15px; width: 100%; max-width: 900px; margin-bottom: 20px; }
        .btn-fw {
            flex: 1; padding: 14px; background: var(--card-bg); border: 1px solid var(--border-color);
            color: var(--text-main); font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.3s;
        }
        .btn-fw.active { border-color: var(--accent-color); color: var(--accent-color); box-shadow: 0 0 12px var(--accent-glow); }
        .btn-fw:disabled { opacity: 0.35; cursor: not-allowed; border-color: #1a1e24; color: #555; }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; width: 100%; max-width: 900px; }
        
        .card { 
            background: var(--card-bg); border: 1px solid var(--border-color); padding: 20px; 
            border-radius: 12px; transition: 0.3s; backdrop-filter: blur(8px);
        }
        .card:hover { border-color: var(--accent-color); transform: translateY(-2px); }
        .card h3 { color: var(--accent-color); margin-bottom: 8px; font-size: 1.15rem; }
        .card p { color: var(--text-sub); font-size: 0.88rem; margin-bottom: 15px; line-height: 1.4; }

        .btn {
            width: 100%; padding: 10px; background: transparent; border: 1px solid var(--accent-color);
            color: var(--accent-color); font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s;
        }
        .btn:hover { background: var(--accent-color); color: var(--bg-color); box-shadow: 0 0 10px var(--accent-glow); }
        .btn-sub { border-color: var(--border-color); color: var(--text-main); margin-top: 8px; }
        .btn-sub:hover { border-color: var(--accent-color); background: rgba(0, 240, 255, 0.1); }
    </style>
</head>
<body>

    <!-- الشريط العلوي مع زر Alfrjany Hen -->
    <div class="top-bar">
        <div class="brand-hen">⚡ Alfrjany Hen</div>
        <div class="status-badge" id="statusText">جاهز للاستخدام</div>
        <button class="btn" style="width:auto; padding: 6px 14px;" onclick="cacheHost()">حفظ للاوفلاين</button>
    </div>

    <!-- أزرار التحديثات -->
    <div class="fw-selector">
        <button class="btn-fw active" id="btn1202" onclick="selectFW('12.02')">إصدار 12.02</button>
        <button class="btn-fw" disabled>إصدار 13.52 (قريباً)</button>
    </div>

    <!-- قسم الخدمات والخيارات لـ 12.02 -->
    <div class="grid">
        <!-- تفعيل الثغرة الرئيسية -->
        <div class="card">
            <h3>12.02 Jailbreak</h3>
            <p>تفعيل ثغرة النواة واستدعاء إشعار النظام المخصص.</p>
            <button class="btn" onclick="triggerNativeJailbreak()">تفعيل التهكيرة</button>
        </div>

        <!-- ميزة Plugin Loader -->
        <div class="card">
            <h3>Plugin Loader</h3>
            <p>قراءة وتفعيل ملفات الأكواد من مجلد <b>/Alfrjany hen/</b> داخل الجهاز.</p>
            <button class="btn" onclick="loadAlfrjanyPlugins()">تشغيل المحرّك والـ Plugins</button>
        </div>

        <!-- قسم Debug Settings والأدوات -->
        <div class="card">
            <h3>Debug Settings</h3>
            <p>إدارة ملفات الـ PKG والتثبيت عبر الفلاشة USB.</p>
            <button class="btn btn-sub" onclick="installPkgFromUSB()">تثبيت PKG من الفلاش (USB)</button>
            <button class="btn btn-sub" onclick="dumpPkgToUSB()">نقل PKG من PS4 إلى الفلاش</button>
        </div>
    </div>

    <script src="engine.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        // استدعاء إشعار سوني الأصلي عبر النواة
        function showPS4Notification(message) {
            // كود إشعار سوني الأصلي (PS4 System Notify Payload)
            if (typeof sceSysUtilSendSystemNotificationWithText !== 'undefined') {
                sceSysUtilSendSystemNotificationWithText(222, message);
            } else {
                // محاكاة الإشعار أثناء التجربة
                alert("[PS4 System Notification]\n" + message);
            }
        }

        function triggerNativeJailbreak() {
            document.getElementById('statusText').innerText = "جاري تفعيل 12.02 Jailbreak...";
            
            setTimeout(() => {
                // نص الإشعار المطلوب بالكامل
                let msg = "12.02 Jailbreak success\nCoded by Alfrjany";
                showPS4Notification(msg);
                document.getElementById('statusText').innerText = "تم التفعيل بنجاح!";
            }, 800);
        }

        function loadAlfrjanyPlugins() {
            showPS4Notification("Alfrjany Plugins Loaded From /Alfrjany hen/");
        }

        function installPkgFromUSB() {
            showPS4Notification("Scanning USB for PKG Files...");
        }

        function dumpPkgToUSB() {
            showPS4Notification("Dumping Game PKG to USB Drive...");
        }

        function cacheHost() {
            alert("تم حفظ كامل صفحات الـ Host للاستخدام بدون إنترنت!");
        }
    </script>
</body>
</html>
